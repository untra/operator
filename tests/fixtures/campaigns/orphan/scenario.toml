# An agent that dies leaves its ticket in progress: reported stalled, never relaunched.
base = "diamond"

[config]
max_parallel = 4
max_agents_per_repo = 2

[expect]
final_status = "running"
stalled = ["FEAT-0001"]

[[agent]]
ticket = "FEAT-0001"
outcomes = ["orphan"]

[[tick]]
launch = ["FEAT-0001"]
status = "running"

[[tick]]
status = "running"
