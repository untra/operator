cognitive-complexity-threshold = 80
too-many-arguments-threshold = 8
type-complexity-threshold = 300
allowed-idents-below-min-chars = ["x", "y", "r", "f", "e", "i", "n", "s", "k", "v"]
doc-valid-idents = ["GitHub", "GitLab", "macOS", "OpenAPI", "OAuth", "TypeScript", "WebSocket", "VsCode", "DevOps", "SubPath", "TodoApp","TOML", "JSON", "YAML", "UUID", "URL", "API", "CLI", "TUI", "PR", "SSH", "HTTP", "HTTPS", "stdin", "stdout", "tmux", "stderr"]
disallowed-methods = [
  { path = "reqwest::Client::new", reason = "use crate::http_client::default_client() so the rustls provider is installed" },
  { path = "reqwest::Client::builder", reason = "use crate::http_client::client_builder() so the rustls provider is installed" },
  { path = "reqwest::blocking::Client::new", allow-invalid = true, reason = "use crate::http_client::blocking_client_builder() so the rustls provider is installed" },
  { path = "reqwest::blocking::Client::builder", allow-invalid = true, reason = "use crate::http_client::blocking_client_builder() so the rustls provider is installed" },
]
