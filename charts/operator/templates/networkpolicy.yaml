{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "operator.fullname" . }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or .Values.networkPolicy.egress.allowDNS .Values.networkPolicy.egress.to .Values.telemetry.collectorEgress.enabled }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.to }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if .Values.telemetry.collectorEgress.enabled }}
    {{- if not .Values.telemetry.collectorEgress.peers }}
    {{- fail "telemetry.collectorEgress.peers must identify the collector" }}
    {{- end }}
    - to:
        {{- toYaml .Values.telemetry.collectorEgress.peers | nindent 8 }}
      ports:
        - port: {{ .Values.telemetry.collectorEgress.port }}
          protocol: TCP
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
