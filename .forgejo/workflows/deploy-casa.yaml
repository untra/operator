name: deploy-casa
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or sha to deploy (blank deploys the dispatched branch)
        required: false
        default: ""

# Builds Dockerfile.local with the dev license keyring and rolls it out to operator.kube.untra.casa.
#   build   runs-on: docker    native arm64 buildx push to the Forgejo registry, tagged by commit sha
#   deploy  runs-on: helmfile  upgrades the release to this ref's chart and image, keeping helmfile's values
# Base images and the checkout action come from Forgejo mirrors; see .forgejo/README.md.
#
# Variables: REGISTRY_IMAGE
# Secrets:   REGISTRY_USERNAME, REGISTRY_TOKEN, KUBECONFIG,
#            OPERATOR_LICENSE_ROOT_KEYS (dev root only), OPERATOR_LICENSE_ISSUER, OPERATOR_PURCHASE_URL

concurrency:
  group: deploy-casa
  cancel-in-progress: false

jobs:
  build:
    runs-on: docker
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: License secrets present
        run: |
          missing=0
          for name in OPERATOR_LICENSE_ROOT_KEYS OPERATOR_LICENSE_ISSUER; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::repository secret $name is unset or empty"
              missing=1
            fi
          done
          exit "$missing"
        env:
          OPERATOR_LICENSE_ROOT_KEYS: ${{ secrets.OPERATOR_LICENSE_ROOT_KEYS }}
          OPERATOR_LICENSE_ISSUER: ${{ secrets.OPERATOR_LICENSE_ISSUER }}

      - uses: https://forgejo.kube.untra.casa/actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Registry login
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "${REGISTRY_IMAGE%%/*}" -u "$REGISTRY_USERNAME" --password-stdin
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      # Default docker driver: a docker-container builder would not trust the home CA.
      # OPERATOR_RELEASE=1 makes build.rs fail on an empty keyring or issuer instead of shipping one that rejects every license.
      - name: Build and push
        id: push
        run: |
          docker buildx build \
            --file Dockerfile.local \
            --build-arg BASE_REGISTRY="${REGISTRY_IMAGE%/*}/mirror/" \
            --build-arg OPERATOR_RELEASE=1 \
            --build-arg OPERATOR_LICENSE_ISSUER="$OPERATOR_LICENSE_ISSUER" \
            --build-arg OPERATOR_LICENSE_ROOT_KEYS="$OPERATOR_LICENSE_ROOT_KEYS" \
            --build-arg OPERATOR_PURCHASE_URL="$OPERATOR_PURCHASE_URL" \
            --cache-from "type=registry,ref=$REGISTRY_IMAGE:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY_IMAGE:buildcache,mode=max" \
            --tag "$REGISTRY_IMAGE:${{ steps.meta.outputs.tag }}" \
            --metadata-file meta.json \
            --push \
            .
          echo "digest=$(node -p "require('./meta.json')['containerimage.digest']")" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          OPERATOR_LICENSE_ISSUER: ${{ secrets.OPERATOR_LICENSE_ISSUER }}
          OPERATOR_LICENSE_ROOT_KEYS: ${{ secrets.OPERATOR_LICENSE_ROOT_KEYS }}
          OPERATOR_PURCHASE_URL: ${{ secrets.OPERATOR_PURCHASE_URL }}

  deploy:
    needs: build
    runs-on: helmfile
    steps:
      - uses: https://forgejo.kube.untra.casa/actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      # The helmfile runner is shared, so the kubeconfig lives in this job's temp dir
      - name: Credentials
        run: |
          umask 077
          printf '%s\n' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}

      # Charts up to 0.2.14 labelled the immutable volumeClaimTemplates; the upgraded StatefulSet adopts the orphaned pod and PVC.
      - name: Adopt legacy StatefulSet
        run: |
          legacy=$(kubectl -n operator get statefulset operator \
            -o jsonpath='{.spec.volumeClaimTemplates[*].metadata.labels.helm\.sh/chart}')
          if [ -n "$legacy" ]; then
            kubectl -n operator delete statefulset operator --cascade=orphan
          fi

      # Helmfile owns the values: keep them, take this ref's chart and image, and reclaim fields from out-of-band kubectl edits.
      - name: Helm upgrade
        run: |
          helm upgrade operator ./charts/operator -n operator \
            --reset-then-reuse-values \
            --force-conflicts \
            --set image.repository="$REGISTRY_IMAGE" \
            --set image.tag="${{ needs.build.outputs.tag }}@${{ needs.build.outputs.digest }}" \
            --wait
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}

      - name: Drop credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
