        examples: ["example"]
        annotations: {"operator": {"redaction_class": "personal"}}
      - id: process.executable.path
        type: "string"
        brief: "Process executable path."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "personal"}}
      - id: http.request.header.authorization
        type: "string"
        brief: "Http request header authorization."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "secret"}}
