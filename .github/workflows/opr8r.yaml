name: opr8r

on:
  push:
    paths:
      - 'opr8r/**'
      - '.github/workflows/opr8r.yaml'
    branches:
      - main
  pull_request:
    paths:
      - 'opr8r/**'
      - '.github/workflows/opr8r.yaml'
  workflow_dispatch:

concurrency:
  group: opr8r-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opr8r
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            opr8r/target
          key: opr8r-${{ runner.os }}-cargo-${{ hashFiles('opr8r/Cargo.lock') }}
          restore-keys: |
            opr8r-${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: opr8r/Cargo.toml
          arguments: --all-features
          command: check

  coverage:
    name: Coverage
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opr8r
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            opr8r/target
          key: opr8r-${{ runner.os }}-cargo-coverage-${{ hashFiles('opr8r/Cargo.lock') }}
          restore-keys: |
            opr8r-${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --locked --all-features --codecov --output-path codecov.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: opr8r/codecov.json
          flags: opr8r
          fail_ci_if_error: true
