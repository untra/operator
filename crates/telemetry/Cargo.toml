[package]
name = "operator-telemetry"
version = "0.1.0"
edition = "2021"
description = "Generated telemetry catalog and redaction policy for Operator"
license = "MIT"

[features]
default = []
redact = ["dep:regex", "dep:hmac", "dep:sha2", "dep:serde_json"]
schema = ["dep:schemars", "dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
regex = { version = "1", optional = true }
hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "0.10", optional = true }
schemars = { version = "1.0", optional = true }
ts-rs = { version = "12", features = ["no-serde-warnings"], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"

[dev-dependencies]
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
redundant_clone = "deny"
clone_on_copy = "deny"
unnecessary_to_owned = "deny"
borrowed_box = "deny"
explicit_auto_deref = "deny"
borrow_deref_ref = "deny"
deref_addrof = "deny"
needless_borrow = "deny"
clone_on_ref_ptr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
wildcard_imports = "allow"
unused_self = "allow"
trivially_copy_pass_by_ref = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_field_names = "allow"
format_push_string = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
doc_link_with_quotes = "allow"
cast_possible_wrap = "allow"
match_same_arms = "allow"
assigning_clones = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
ref_option = "allow"
fn_params_excessive_bools = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
needless_for_each = "allow"
needless_continue = "allow"
match_wildcard_for_single_variants = "allow"
redundant_else = "allow"
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
single_match_else = "allow"
nonminimal_bool = "allow"
