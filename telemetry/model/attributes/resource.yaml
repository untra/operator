groups:
  - id: registry.operator.resource
    type: "attribute_group"
    brief: "Reviewed telemetry attributes."
    attributes:
      - id: error.type
        type: "string"
        brief: "Telemetry SDK failure category."
        stability: "development"
        examples: ["queue_full"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: otel.component.type
        type: "string"
        brief: "Telemetry SDK component type."
        stability: "development"
        examples: ["batching_log_processor"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: otel.component.name
        type: "string"
        brief: "Telemetry SDK component instance."
        stability: "development"
        examples: ["batching_log_processor/1"]
        annotations: {"operator": {"redaction_class": "internal"}}
      - id: service.name
        type: "string"
        brief: "Service name."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: service.version
        type: "string"
        brief: "Service version."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: telemetry.sdk.name
        type: "string"
        brief: "Telemetry sdk name."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: telemetry.sdk.language
        type: "string"
        brief: "Telemetry sdk language."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: telemetry.sdk.version
        type: "string"
        brief: "Telemetry sdk version."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "public"}}
      - id: k8s.pod.name
        type: "string"
        brief: "K8s pod name."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "internal"}}
      - id: k8s.namespace.name
        type: "string"
        brief: "K8s namespace name."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "internal"}}
      - id: service.instance.id
        type: "string"
        brief: "Service instance id."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "internal"}}
      - id: user.email
        type: "string"
        brief: "User email."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "personal"}}
      - id: user.name
        type: "string"
        brief: "User name."
        stability: "development"
        examples: ["example"]
        annotations: {"operator": {"redaction_class": "personal"}}
      - id: user.id
        type: "string"
