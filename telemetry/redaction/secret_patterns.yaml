patterns:
  - name: anthropic
    regex: "sk-ant-[A-Za-z0-9_-]+"
  - name: github
    regex: "(?:gh[pousr]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+)"
  - name: aws_access_key
    regex: "(?:AKIA|ASIA)[A-Z0-9]{16}"
  - name: jwt
    regex: "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
  - name: bearer
    regex: "(?i:bearer)(?:[ \\t]+|%20)[A-Za-z0-9._~+/%=-]+"
