coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
      rust:
        target: auto
        threshold: 2%
        flags:
          - rust
      vscode-extension:
        target: auto
        threshold: 2%
        flags:
          - vscode-extension
      opr8r:
        target: auto
        threshold: 2%
        flags:
          - opr8r
      relay:
        target: auto
        threshold: 2%
        flags:
          - relay
      telemetry:
        target: auto
        threshold: 2%
        flags:
          - telemetry
    patch:
      default:
        target: 80%

flags:
  rust:
    paths:
      - src/
    carryforward: true
  vscode-extension:
    paths:
      - vscode-extension/src/
    carryforward: true
  opr8r:
    paths:
      - opr8r/src/
    carryforward: true
  relay:
    paths:
      - crates/relay/src/
    carryforward: true
  telemetry:
    paths:
      - crates/telemetry/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "tests/**"
  - "vscode-extension/test/**"
